<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>मेरा फॉर्म</title>
</head>
<body>
    <h2>जानकारी सबमिट करें</h2>
    <form id="myForm">
        <label>नाम: <input type="text" name="name" required></label><br><br>
        <label>ईमेल: <input type="email" name="email" required></label><br><br>
        <label>संदेश: <textarea name="message" required></textarea></label><br><br>
        <button type="submit">सबमिट करें</button>
    </form>

    <script>
        document.getElementById('myForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const payload = {
                name: formData.get('name'),
                email: formData.get('email'),
                message: formData.get('message')
            };

            // ध्यान दें: यहाँ GitHub Token डालने की जरूरत है
            // असली उपयोग में इसे सर्वर साइड पर रखें, फ्रंटएंड में हार्डकोड न करें
            const response = await fetch('https://api.github.com/repos/आपका-उपयोगकर्ता-नाम/आपका-रिपॉजिटरी-नाम/dispatches', {
                method: 'POST',
                headers: {
                    'Authorization': 'token ghp_xxxxxxxxxxxx', // अपने Token से बदलें
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    event_type: 'form_submit',
                    client_payload: payload
                })
            });

            if (response.ok) {
                alert('सबमिट सफल!');
                e.target.reset();
            } else {
                alert('सबमिट विफल, फिर से प्रयास करें');
            }
        });
    </script>
</body>
</html>
